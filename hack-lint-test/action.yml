name: "HackLintTest"
description: "Runs the Hack typechecker, linter (HHAST) and tests (HackTest)"
inputs:
  composer_version:
    description: "Composer release selector: latest, major (2), minor (2.10), or exact version (2.10.3)."
    required: false
    default: "latest"
  hhvm:
    description: "HHVM version (latest/nightly/#.##)"
    required: true
  skip_lint:
    description: 'Optional. Set to "true" to skip the hhast-lint step.'
    required: false
    default: false
  skip_tests:
    description: 'Optional. Set to "true" to skip the hacktest step.'
    required: false
    default: false
  skip_production_typecheck:
    description: 'Set to "true" to skip the final check that prunes the checkout to package files and reinstalls production dependencies.'
    required: false
    default: false
  typecheck_engine:
    description: >
      Optional. One of "hh_client", "hh_server", or "strict"; defaults to "hh_client".
      "hh_client" will use `hh_client` to typecheck, which reports errors only.
      "hh_server" will use `hh_server --check .`, which reports lint warnings but does not quit on them.
      "strict" runs `hh_server --check --json .` and fails on any reported diagnostic,
      including warnings, as well as checker failures or invalid JSON output.
      "strict" is recommended for projects that require warning-free typechecking.
      The default is "hh_client" for backwards compatibility.
    required: false
    default: "hh_client"
  lint_engine:
    description: >
      Optional. One of "hhast", "pha", or "pha-server"; defaults to "hhast".
      "hhast" will invoke vendor/hhvm/hhast/bin/hhast-lint
      "pha" will invoke vendor/hershel-theodore-layton/portable-hack-ast-linters-server/bin/portable-hack-ast-linters-server-bundled.resource
      "pha-server" requires portable-hack-ast-linters-server >=0.6.1;
      it runs vendor/bin/pha-linters-server.sh -e -d and lints in repo auth mode.
      The extra optimization time pays off for medium-small projects or larger.
    required: false
    default: "hhast"
  test_engine:
    description: >
      Optional. Can either be "hacktest" or "test-chain", defaults to "hacktest".
      "hacktest" will invoke vendor/hhvm/hacktest/bin/hacktest tests/
      "test-chain" will invoke vendor/hershel-theodore-layton/test-chain/bin/test-chain --ci
    required: false
    default: "hacktest"
  lint_args:
    description: >
      Optional. Command line arguments for your linter.
      For "pha-server": lint-all [text|vscode-json] [directories],
      with directories as a comma-separated list (default: src,tests).
    required: false
  hhvm_flags:
    description: "Optional. Command line arguments that will be added to all `hhvm` invocations (hh-autoload, hhast-lint, hacktest)."
    required: false
runs:
  using: "composite"
  steps:
    - name: Install Composer
      id: composer
      shell: bash
      env:
        REQUESTED_COMPOSER_VERSION: ${{ inputs.composer_version }}
      run: |
        id -u autoloader-user &>/dev/null || useradd -m -u 1001 -c "" -p '!' autoloader-user
        "${GITHUB_ACTION_PATH}/install-composer.sh" "$REQUESTED_COMPOSER_VERSION" "$GITHUB_ACTION_PATH"
    - name: Install Watchman
      shell: bash
      run: ${GITHUB_ACTION_PATH}/install-watchman.sh
    - name: Inspect HHVM and Hack versions
      shell: bash
      run: |
        hhvm --version
        hh_client --version
    - if: github.ref_type != 'tag'
      shell: bash
      run: echo "COMPOSER_ROOT_VERSION=dev-${{github.base_ref || github.ref_name}}" >> $GITHUB_ENV
    - name: Install project dependencies
      shell: bash
      env:
        COMPOSER_BINARY: ${{ steps.composer.outputs.binary }}
      run: |
        echo "::group::Install project dependencies"
        FLAGS=""
        VERSION_SPECIFIC_COMPOSER="composer.${{inputs.hhvm}}.json"

        if [ -n "${{inputs.hhvm_flags}}" ]; then
          FLAGS="--no-autoloader"
        fi

        if [ -f $VERSION_SPECIFIC_COMPOSER ]; then
          COMPOSER=$VERSION_SPECIFIC_COMPOSER
        elif [ -f "composer.dev.json" ]; then
          COMPOSER="composer.dev.json"
        else
          COMPOSER="composer.json"
        fi

        echo "Using $COMPOSER"

        COMPOSER=$COMPOSER "$COMPOSER_BINARY" install $FLAGS
        echo "::endgroup::"
    - name: Generate autoload map
      shell: bash
      run: |
        echo "::group::Generate autoload map"

        if [ -f vendor/hhvm/hhvm-autoload/bin/hh-autoload.hack ]; then
          echo "Patch hhvm-autoload so that it can use the built-in hsl."

          sed -i 's/!$have_hsl/!$have_hsl \&\& !\\class_exists("HH\\Lib\\Ref")/' \
            vendor/hhvm/hhvm-autoload/bin/hh-autoload.hack
          (
            set -x
            hhvm ${{inputs.hhvm_flags}} vendor/hhvm/hhvm-autoload/bin/hh-autoload
          )
          cat vendor/autoload.hack
          hhvm --php ${{inputs.hhvm_flags}} -r "echo (\function_exists('HH\Facts\enabled') && \HH\Facts\enabled() ? 'Using ext_watchman' : 'Using hhvm-autoload');"
        else
          echo "HHVM Autoload not detected, skipping this step."
        fi

        echo "::endgroup::"
    - name: Typecheck
      shell: bash
      run: |
        ${GITHUB_ACTION_PATH}/typecheck.sh "${{inputs.typecheck_engine}}"
    - name: Lint
      shell: bash
      run: |
        ${GITHUB_ACTION_PATH}/lint.sh \
          "${{inputs.hhvm}}" \
          "${{inputs.skip_lint}}" \
          "${{inputs.hhvm_flags}}" \
          "${{inputs.lint_engine}}" \
          "${{inputs.lint_args}}"
    - name: Run tests
      shell: bash
      run: |
        ${GITHUB_ACTION_PATH}/test.sh \
          "${{inputs.skip_tests}}" \
          "${{inputs.hhvm_flags}}" \
          "${{inputs.test_engine}}"
    - name: Typecheck production package
      if: inputs.skip_production_typecheck != 'true'
      shell: bash
      env:
        COMPOSER_BINARY: ${{ steps.composer.outputs.binary }}
      run: |
        "${GITHUB_ACTION_PATH}/production-typecheck.sh" "${{inputs.typecheck_engine}}" "${{inputs.hhvm_flags}}"
