name: Continuous Integration
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "24 18 * * FRI"
jobs:
  build:
    name: "Skip: ${{matrix.skip}} Checker: ${{matrix.checker}} (${{matrix.hhvm}})"
    strategy:
      fail-fast: false
      matrix:
        skip: [true, false]
        checker: ["hh_client", "hh_server"]
        hhvm:
          - "4.153"
          - "4.168"
          - "25.6.0"
          - "25.7.0"
          - "26.03.28"
          - "26.06.05"
    runs-on: ubuntu-24.04
    container:
      image: ${{ startsWith(matrix.hhvm, '4') && format('hhvm/hhvm:{0}-latest', matrix.hhvm) || format('hersheltheodorelayton/hhvm-full:{0}', matrix.hhvm) }}
    steps:
      - uses: actions/checkout@v2
      # No way to set working directory for a GitHub Action :(
      - name: Move test files to repository root
        shell: bash
        env:
          TEST_PROJECT: ${{ startsWith(matrix.hhvm, '4.') && 'test-project-legacy' || 'test-project-modern' }}
        run: |
          shopt -s dotglob
          mkdir -p "$RUNNER_TEMP/hack-action-fixtures"
          mv test-project-legacy test-project-modern "$RUNNER_TEMP/hack-action-fixtures/"
          mv "$RUNNER_TEMP/hack-action-fixtures/$TEST_PROJECT/"* .
      - name: Watchman Autoload Run
        uses: ./hack-lint-test
        with:
          hhvm: ${{matrix.hhvm}}
          hhvm_flags: ${{ startsWith(matrix.hhvm, '4') && '-dhhvm.autoload.enabled=true -dhhvm.autoload.db.path=.var/facts.db' || '' }}
          skip_lint: ${{matrix.skip || matrix.hhvm == '4.102'}}
          skip_tests: ${{matrix.skip}}
          lint_engine: ${{ startsWith(matrix.hhvm, '4.') && 'hhast' || 'pha' }}
          test_engine: ${{ startsWith(matrix.hhvm, '4.') && 'hacktest' || 'test-chain' }}
          typecheck_engine: ${{matrix.checker}}
      - name: Verify native autoload
        shell: bash
        run: hhvm ${{ startsWith(matrix.hhvm, '4.') && '-dhhvm.autoload.enabled=true -dhhvm.autoload.db.path=.var/facts.db' || '' }} check-autoload.hack native
      - name: HHVM Autoload Run
        if: startsWith(matrix.hhvm, '4.')
        uses: ./hack-lint-test
        with:
          hhvm: ${{matrix.hhvm}}
          skip_lint: ${{matrix.skip}}
          skip_tests: ${{matrix.skip}}
          lint_engine: hhast
          typecheck_engine: ${{matrix.checker}}
      - name: Verify legacy autoload mode
        if: startsWith(matrix.hhvm, '4.')
        shell: bash
        run: hhvm check-autoload.hack legacy
